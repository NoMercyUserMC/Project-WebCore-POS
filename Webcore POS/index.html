<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&M ELECTRONIC STORE — WEBCORE POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Optional CDN helpers. The POS degrades gracefully when offline:
     - qrcode-generator: QR image generation (barcode generation is built-in, no CDN needed)
     - html5-qrcode: camera decoding fallback (native BarcodeDetector is preferred, no CDN needed) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
/* ============================================================
   WEBCORE POS — DESIGN SYSTEM
   ============================================================ */
:root{
  --fd:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --r-sm:10px;
}
:root[data-theme="dark"]{
  --bg:#0b0f13; --bg2:#0f151b; --ink:#e9eef3; --ink2:#8fa0af; --ink3:#5d6d7c;
  --glass:rgba(21,29,37,.78); --glass2:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --accent:#33d69f; --accent-ink:#04150d; --accent-dim:rgba(51,214,159,.14);
  --danger:#f26d5f; --danger-dim:rgba(242,109,95,.14);
  --warn:#e8a33d; --warn-dim:rgba(232,163,61,.15);
  --steel:#8aa3b8; --teal:#3ec1b3;
  --shadow:0 18px 48px rgba(0,0,0,.5);
  --paper:#fdfdfb; --paper-ink:#171a1c;
}
:root[data-theme="light"]{
  --bg:#eef0ec; --bg2:#e6e9e3; --ink:#1a222a; --ink2:#5b6a76; --ink3:#93a1ac;
  --glass:rgba(255,255,255,.72); --glass2:rgba(20,40,30,.04); --line:rgba(20,35,45,.12);
  --line2:rgba(20,35,45,.22);
  --accent:#0b8a5c; --accent-ink:#f2fbf6; --accent-dim:rgba(11,138,92,.12);
  --danger:#c9463a; --danger-dim:rgba(201,70,58,.12);
  --warn:#a06a10; --warn-dim:rgba(200,140,30,.16);
  --steel:#5f7d96; --teal:#1d8f83;
  --shadow:0 18px 44px rgba(30,45,40,.16);
  --paper:#ffffff; --paper-ink:#171a1c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fd);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 85% -10%,var(--accent-dim),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,var(--glass2),transparent 60%)}
.mono{font-family:var(--fm)}
.hidden{display:none!important}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--fm);font-size:10.5px;background:var(--glass2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink2)}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);
  background:var(--glass2);color:var(--ink);font:inherit;font-weight:600;border-radius:var(--r-sm);
  padding:9px 16px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s,filter .15s;
  white-space:nowrap;min-height:38px;user-select:none}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger-dim);color:var(--danger);border-color:transparent}
.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.soft{background:var(--accent-dim);color:var(--accent);border-color:transparent}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:12px;min-height:48px}
.btn.sm{padding:5px 11px;min-height:30px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.btn.danger svg,.btn.primary svg{width:17px;height:17px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;transition:all .15s;flex:none}
.icon-btn:hover{background:var(--glass2);color:var(--ink);border-color:var(--line)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-dim)}
.icon-btn svg{width:17px;height:17px}

/* ---------- Form fields ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.inp{width:100%;background:var(--glass2);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink);font:inherit;padding:9px 12px;min-height:40px;transition:border-color .15s,background .15s}
.inp:focus{outline:none;border-color:var(--accent);background:var(--glass)}
.inp.mono{font-family:var(--fm)}
textarea.inp{resize:vertical;min-height:70px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.hint{font-size:12px;color:var(--ink3)}
.switch{position:relative;display:inline-block;width:44px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:20px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:19px;height:19px;border-radius:50%;left:3px;top:3px;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(19px)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.switch-row:last-child{border-bottom:none}
.switch-row .sr-label b{display:block;font-weight:600}
.switch-row .sr-label small{color:var(--ink3)}
.seg{display:inline-flex;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;color:var(--ink2);font:inherit;font-weight:600;font-size:12.5px;
  padding:6px 14px;border-radius:7px;cursor:pointer;transition:all .15s}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-card{flex:1;min-width:130px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;
  display:flex;gap:9px;align-items:flex-start;transition:all .15s;background:var(--glass2)}
.radio-card:hover{border-color:var(--line2)}
.radio-card input{margin-top:3px;accent-color:var(--accent)}
.radio-card.on{border-color:var(--accent);background:var(--accent-dim)}
.radio-card b{display:block;font-size:13.5px}
.radio-card small{color:var(--ink2);font-size:11.5px}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--accent-dim);color:var(--accent)}
.b-low{background:var(--warn-dim);color:var(--warn)}
.b-out{background:var(--danger-dim);color:var(--danger)}
.b-done{background:var(--accent-dim);color:var(--accent)}
.b-void{background:var(--danger-dim);color:var(--danger)}
.b-ref{background:var(--warn-dim);color:var(--warn)}
.b-role{background:var(--glass2);color:var(--ink2);border:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--glass2);color:var(--ink2);font:inherit;font-size:12.5px;
  font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ---------- Panels / tables ---------- */
.panel{background:var(--glass);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h3{font-size:15px;display:flex;align-items:center;gap:9px}
.panel-head h3 svg{width:17px;height:17px;color:var(--accent)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--glass2);position:sticky;top:0;backdrop-filter:blur(8px);z-index:2}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--glass2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-family:var(--fm)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;background:var(--glass2);border:1px solid var(--line);flex:none}
.thumb-tile{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:var(--accent-ink);flex:none}
.pcell{display:flex;align-items:center;gap:11px}
.pcell b{display:block}
.pcell small{color:var(--ink3);font-family:var(--fm);font-size:11px}

/* ---------- KPI strip ---------- */
.kpis{display:flex;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;flex-wrap:wrap}
.kpi{flex:1;min-width:150px;padding:18px 20px;position:relative}
.kpi+.kpi::before{content:"";position:absolute;left:0;top:16%;height:68%;width:1px;background:var(--line)}
.kpi small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.kpi b{font-family:var(--fm);font-size:23px;font-weight:600;letter-spacing:-.02em}
.kpi .kpi-sub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.kpi.hot b{color:var(--accent)}
.kpi.warnk b{color:var(--warn)}
.kpi.dangerk b{color:var(--danger)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--ink2)}
.empty .empty-ic{width:56px;height:56px;border-radius:16px;border:1px dashed var(--line2);display:flex;
  align-items:center;justify-content:center;margin:0 auto 14px;color:var(--ink3)}
.empty .empty-ic svg{width:24px;height:24px}
.empty b{display:block;font-size:15px;color:var(--ink);letter-spacing:.05em;margin-bottom:4px}
.empty p{font-size:13px;margin-bottom:16px}
.empty .btn{margin:0 4px}

/* ---------- Modals ---------- */
#modalRoot .modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(5,10,14,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;transition:opacity .18s;overflow-y:auto}
#modalRoot .modal-backdrop.show{opacity:1}
.modal{background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);width:100%;padding:22px;
  transform:translateY(14px) scale(.97);transition:transform .2s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.modal-backdrop.show .modal{transform:none}
.m-sm{max-width:430px}.m-md{max-width:600px}.m-lg{max-width:840px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.modal-head h3{font-size:17px}
.modal-head p{font-size:12.5px;color:var(--ink2);margin-top:3px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.confirm-msg{color:var(--ink2);font-size:13.5px;margin-bottom:14px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{display:flex;align-items:flex-start;gap:10px;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;
  box-shadow:var(--shadow);font-size:13.5px;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2)}
.toast svg{width:17px;height:17px;flex:none;margin-top:1px}
.toast.t-success{border-left-color:var(--accent)}.toast.t-success svg{color:var(--accent)}
.toast.t-error{border-left-color:var(--danger)}.toast.t-error svg{color:var(--danger)}
.toast.t-warn{border-left-color:var(--warn)}.toast.t-warn svg{color:var(--warn)}
.toast.t-info{border-left-color:var(--steel)}.toast.t-info svg{color:var(--steel)}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* ============================================================
   AUTH / LOGIN
   ============================================================ */
.auth-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
  background:var(--bg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:center;
  background:linear-gradient(var(--bg),var(--bg)) padding-box}
.auth-wrap::before{content:"";position:absolute;inset:0;
  background:
   radial-gradient(700px 420px at 78% 18%,var(--accent-dim),transparent 65%),
   radial-gradient(600px 420px at 12% 88%,var(--glass2),transparent 65%)}
.auth-card{position:relative;z-index:2;width:100%;max-width:880px;display:grid;grid-template-columns:1.05fr 1fr;
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--line2);
  border-radius:22px;box-shadow:var(--shadow);overflow:hidden;animation:popIn .45s cubic-bezier(.2,.9,.3,1.15)}
.auth-card.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.auth-brand{position:relative;background:var(--bg2);border-right:1px solid var(--line);padding:44px 40px;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-height:520px}
.traces{position:absolute;inset:0;opacity:.5;pointer-events:none}
.traces path{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 130;opacity:.5;
  animation:dash 5.5s linear infinite}
.traces path:nth-child(2){animation-duration:7s;animation-delay:1.2s;opacity:.3}
.traces path:nth-child(3){animation-duration:9s;animation-delay:2.4s;opacity:.35}
.traces circle{fill:var(--accent);opacity:.7}
@keyframes dash{to{stroke-dashoffset:-136}}
.brandblock .mark{width:58px;height:58px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 10px 30px var(--accent-dim)}
.brandblock .mark svg{width:30px;height:30px}
.brandblock h1{font-size:30px;line-height:1.1;letter-spacing:-.02em}
.brandblock .sub{color:var(--accent);font-size:11.5px;font-weight:700;letter-spacing:.32em;margin-top:8px}
.auth-brand .feat{display:flex;gap:11px;align-items:center;color:var(--ink2);font-size:13px;margin-top:12px}
.auth-brand .feat svg{width:16px;height:16px;color:var(--accent);flex:none}
.auth-form{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.auth-form h2{font-size:21px;margin-bottom:4px}
.auth-form .lead{color:var(--ink2);font-size:13px;margin-bottom:24px}
.pw-box{position:relative}
.pw-box .inp{padding-right:44px}
.pw-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.auth-note{font-size:11.5px;color:var(--ink3);margin-top:18px;line-height:1.5;border-top:1px dashed var(--line);padding-top:12px}
.auth-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.12em;z-index:2}
.or-div{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:11px;letter-spacing:.15em;margin:16px 0}
.or-div::before,.or-div::after{content:"";flex:1;height:1px;background:var(--line)}
.welcome-hero{text-align:center;padding:10px 0 4px}
.welcome-hero .mark{width:62px;height:62px;border-radius:18px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.welcome-hero .mark svg{width:32px;height:32px}
.welcome-hero h2{font-size:22px;letter-spacing:.04em}
.welcome-hero p{color:var(--ink2);font-size:13px;margin-top:6px}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;height:100vh;position:relative;z-index:1}
#sidebar{width:238px;flex:none;background:var(--glass);backdrop-filter:blur(20px) saturate(1.25);
  border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .22s,transform .25s;z-index:60}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.side-brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;flex:none}
.side-brand .mark svg{width:20px;height:20px}
.side-brand b{font-size:15px;display:block;line-height:1.1}
.side-brand small{font-size:9px;letter-spacing:.22em;color:var(--ink3)}
.side-nav{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink2);
  font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid transparent;position:relative;
  transition:all .15s;text-align:left;background:none;font-family:inherit;width:100%}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{color:var(--ink);background:var(--glass2)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{color:var(--ink);background:var(--glass2);border-color:var(--line)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:22%;height:56%;width:3px;
  background:var(--accent);border-radius:0 3px 3px 0}
.nav-item.active svg{color:var(--accent)}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.userchip{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.avatar{width:33px;height:33px;border-radius:10px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.userchip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip small{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.side-foot .icon-btn{width:30px;height:30px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:40}
.topbar h2{font-size:16.5px}
.burger{display:none}
.top-spacer{flex:1}
.clock{font-family:var(--fm);font-size:12.5px;color:var(--ink2);background:var(--glass2);
  border:1px solid var(--line);padding:6px 12px;border-radius:9px;white-space:nowrap}
#page{flex:1;overflow-y:auto;padding:22px;animation:pageIn .28s ease}
#page.flat{padding:0;overflow:hidden}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:19px}
.page-head p{font-size:12.5px;color:var(--ink2);margin-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp,.toolbar select.inp{width:auto;min-width:150px}
.searchbox{position:relative;flex:1;min-width:200px;max-width:380px}
.searchbox .inp{padding-left:38px}
.searchbox>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3);pointer-events:none}
.searchbox .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.divider{height:1px;background:var(--line);margin:16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ============================================================
   POS / CASHIER SCREEN
   ============================================================ */
.pos-wrap{display:grid;grid-template-columns:1fr 408px;gap:16px;height:100%;padding:16px;min-height:0}
.pos-left{display:flex;flex-direction:column;min-width:0;min-height:0;gap:12px}
.pos-toolbar{display:flex;gap:10px;flex:none}
.cat-chips{display:flex;gap:8px;overflow-x:auto;flex:none;padding-bottom:4px;scrollbar-width:none}
.cat-chips::-webkit-scrollbar{display:none}
.prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
  gap:11px;align-content:start;padding:2px;min-height:0}
.pcard{position:relative;text-align:left;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);
  border-radius:var(--r);padding:9px;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  transition:transform .15s,border-color .15s,box-shadow .2s;color:var(--ink);font-family:inherit;min-height:0}
.pcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.28),0 0 0 1px var(--accent-dim)}
.pcard:active{transform:translateY(0) scale(.975)}
.pcard-img{height:86px;border-radius:9px;overflow:hidden;background:var(--glass2);display:flex;
  align-items:center;justify-content:center;position:relative}
.pcard-img img{width:100%;height:100%;object-fit:cover;background:var(--bg2)}
.pc-tile{font-size:30px;font-weight:700;color:hsl(var(--h,150),60%,55%);opacity:.9}
.pcard-name{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;line-clamp:2;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pcard-sku{font-size:10.5px;color:var(--ink3)}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.pcard-foot b{font-family:var(--fm);font-size:14px}
.pcard.out{opacity:.55}
.pcard.out:hover{border-color:var(--danger);box-shadow:none;transform:none}
.pcard .minibadge{font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:12px}
.mb-ok{background:var(--accent-dim);color:var(--accent)}
.mb-low{background:var(--warn-dim);color:var(--warn)}
.mb-out{background:var(--danger-dim);color:var(--danger)}
/* Receipt / cart panel */
.pos-right{display:flex;flex-direction:column;min-height:0;background:var(--glass);backdrop-filter:blur(20px) saturate(1.25);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.rc-head{padding:14px 16px 10px;border-bottom:1px dashed var(--line2)}
.rc-head .rc-title{display:flex;align-items:center;justify-content:space-between}
.rc-head .rc-title b{font-size:12px;letter-spacing:.22em;color:var(--ink2)}
.rc-head .rc-no{font-family:var(--fm);font-size:12px;color:var(--accent)}
.rc-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:5px;font-family:var(--fm)}
.cart-cust{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px dashed var(--line);
  color:var(--ink2);font-size:12.5px;cursor:pointer;transition:background .15s;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;width:100%}
.cart-cust:hover{background:var(--glass2)}
.cart-cust svg{width:14px;height:14px;color:var(--accent)}
.cart-cust b{color:var(--ink);font-weight:600}
.cart-lines{flex:1;overflow-y:auto;padding:8px 10px;min-height:60px;display:flex;flex-direction:column;gap:6px}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--glass2);animation:lineIn .25s ease}
.cart-line.flash{animation:lineFlash .5s}
@keyframes lineIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes lineFlash{0%{border-color:var(--accent);background:var(--accent-dim)}100%{}}
.cl-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cl-name{font-weight:600;font-size:13px}
.cl-x{color:var(--ink3)}
.cl-meta{font-size:11px;color:var(--ink3);font-family:var(--fm)}
.cl-ctrl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.stepper button{width:28px;height:28px;border:none;background:none;color:var(--ink);font-size:16px;cursor:pointer;
  border-radius:7px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.stepper button:hover{background:var(--glass2);color:var(--accent)}
.stepper button:active{transform:scale(.88)}
.stepper svg{width:13px;height:13px}
.stepper .qv{min-width:30px;text-align:center;font-family:var(--fm);font-weight:600;font-size:13px}
.cl-right{display:flex;align-items:center;gap:6px}
.cl-disc{font-size:10px;font-family:var(--fm);background:var(--warn-dim);color:var(--warn);border:1px dashed var(--warn);
  border-radius:6px;padding:2px 6px;cursor:pointer}
.cl-total{font-family:var(--fm);font-weight:600;font-size:13.5px}
.tax-tag{font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:5px;
  background:var(--glass2);border:1px solid var(--line);color:var(--ink2);vertical-align:1px}
.tot-sec{padding:10px 16px;border-top:1px dashed var(--line2)}
.tot-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:2.5px 0}
.tot-row b{font-family:var(--fm);color:var(--ink);font-weight:500}
.tot-row .disc-link{color:var(--warn);cursor:pointer;border-bottom:1px dashed var(--warn)}
.tot-total{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px}
.tot-total span{font-size:12px;letter-spacing:.2em;color:var(--ink2);font-weight:700}
.tot-total b{font-family:var(--fm);font-size:26px;letter-spacing:-.02em}
.tot-total b.tick{animation:tick .35s}
@keyframes tick{30%{color:var(--accent);transform:scale(1.05)}}
.tot-note{font-size:10.5px;color:var(--ink3);padding:0 16px 8px}
.cart-actions{display:flex;gap:8px;padding:10px 14px 12px}
.cart-actions .btn{flex:1}
.held-row{display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap}
.held-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--fm);background:var(--warn-dim);
  color:var(--warn);border:1px dashed var(--warn);padding:4px 6px 4px 10px;border-radius:8px}
.held-chip button{border:none;background:none;color:inherit;cursor:pointer;display:flex;padding:1px;border-radius:4px}
.held-chip button:hover{background:rgba(0,0,0,.15)}
.held-chip svg{width:12px;height:12px}

/* ---------- Checkout modal ---------- */
.ck-total{text-align:center;padding:14px;border:1px dashed var(--line2);border-radius:12px;margin-bottom:16px;background:var(--glass2)}
.ck-total small{display:block;font-size:10.5px;letter-spacing:.25em;color:var(--ink3)}
.ck-total b{font-family:var(--fm);font-size:34px;color:var(--accent);letter-spacing:-.02em}
.pay-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px}
.pay-tab{border:1px solid var(--line);background:var(--glass2);border-radius:11px;padding:10px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  color:var(--ink2);transition:all .15s;font-family:inherit}
.pay-tab svg{width:18px;height:18px}
.pay-tab:hover{border-color:var(--line2);transform:translateY(-1px)}
.pay-tab.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.quick-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.change-box{margin-top:14px;padding:13px 16px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.change-box.ok{border-color:var(--accent);background:var(--accent-dim)}
.change-box.bad{border-color:var(--danger);background:var(--danger-dim)}
.change-box small{font-size:10.5px;letter-spacing:.2em;color:var(--ink2)}
.change-box b{font-family:var(--fm);font-size:22px}
.change-box.ok b{color:var(--accent)}
.change-box.bad b{color:var(--danger)}

/* ---------- Receipt paper ---------- */
.rcpt-wrap{max-height:62vh;overflow-y:auto;padding:4px 2px}
.printer-anim{overflow:hidden}
.printer-slot{height:12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);margin-bottom:0;
  display:flex;align-items:center;justify-content:center;gap:4px}
.printer-slot i{width:34px;height:3px;border-radius:2px;background:var(--line2)}
.rcpt-paper{background:var(--paper);color:var(--paper-ink);border-radius:0 0 10px 10px;padding:18px 20px 16px;
  max-width:360px;margin:0 auto;font-family:var(--fm);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.printer-anim .rcpt-paper{animation:printOut 1s cubic-bezier(.3,.8,.4,1) both}
@keyframes printOut{0%{max-height:0;opacity:.4;transform:translateY(-24px);padding-top:0;padding-bottom:0}
  55%{opacity:1}100%{max-height:900px;transform:none}}
.rcpt{font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rc-c{text-align:center}
.rc-store{font-weight:700;font-size:15px;letter-spacing:.03em;font-family:var(--fd)}
.rc-sm{font-size:10.5px;margin-top:2px}
.rc-xs{font-size:9px;color:#777;margin-top:4px;letter-spacing:.06em}
.rc-foot{margin-top:10px;padding-top:8px;border-top:1px dashed #bbb;text-align:center;font-size:9.5px;color:#777;letter-spacing:.06em}
.rcpt-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* ---------- Scanner ---------- */
.scan-shell{display:flex;flex-direction:column;gap:14px}
.scan-stage{position:relative;border-radius:14px;overflow:hidden;background:#060a0d;border:1px solid var(--line2);aspect-ratio:16/9}
.scan-stage video,#qcTarget{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#qcTarget video{width:100%!important;height:100%!important;object-fit:cover!important;border:none!important;display:block}
#qcTarget canvas{display:none!important}
.scan-laser{position:absolute;left:8%;right:8%;top:0;height:2px;background:var(--accent);
  box-shadow:0 0 12px 2px var(--accent);opacity:0;pointer-events:none;border-radius:2px}
.scan-stage.live .scan-laser{opacity:.85;animation:laser 2.1s ease-in-out infinite}
@keyframes laser{0%,100%{top:14%}50%{top:84%}}
.scan-corner{position:absolute;width:30px;height:30px;border:3px solid var(--accent);opacity:.9;pointer-events:none}
.sc-tl{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.sc-tr{top:14px;right:14px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.sc-bl{bottom:14px;left:14px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.sc-br{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scan-flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:rgba(4,14,10,.82);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .18s;text-align:center;padding:16px}
.scan-flash.show{opacity:1}
.scan-flash .sf-ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:popIn .3s}
.scan-flash.ok .sf-ic{background:var(--accent);color:var(--accent-ink)}
.scan-flash.err .sf-ic{background:var(--danger);color:#fff}
.scan-flash .sf-ic svg{width:26px;height:26px}
.scan-flash b{font-size:15px;letter-spacing:.14em;color:#fff}
.scan-flash span{font-size:12.5px;color:#bcd0c8}
.scan-status{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.scan-status .dotp{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.scan-status.live .dotp{background:var(--accent);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.3}}
.scan-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scanlist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.scan-item{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--glass2);animation:lineIn .25s}
.scan-item.miss{border-color:var(--danger);background:var(--danger-dim)}
.scan-item .mono{color:var(--ink2);font-size:11px}

/* ---------- Charts / reports ---------- */
.chart-wrap{overflow-x:auto}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-row .bl{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:14px;background:var(--glass2);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.3,1);min-width:2px}
.bar-fill.alt{background:var(--steel)}.bar-fill.alt2{background:var(--teal)}.bar-fill.alt3{background:var(--warn)}.bar-fill.alt4{background:var(--ink3)}
.bar-row .bv{width:92px;flex:none;text-align:right;font-family:var(--fm);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* ---------- Barcode / QR modal ---------- */
.code-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.code-box{border:1px dashed var(--line2);border-radius:12px;padding:16px;background:var(--paper);color:var(--paper-ink);
  display:flex;flex-direction:column;align-items:center;gap:9px;min-height:150px;justify-content:center}
.code-box canvas{max-width:100%}
.code-box small{font-size:9.5px;letter-spacing:.18em;color:#888;font-weight:700}
.code-val{font-family:var(--fm);font-size:13px;text-align:center;word-break:break-all}
@media(max-width:560px){.code-grid{grid-template-columns:1fr}}

/* ---------- Boot splash ---------- */
#boot{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
#boot .mark{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;animation:markPulse 1.2s ease infinite}
#boot .mark svg{width:32px;height:32px}
@keyframes markPulse{50%{transform:scale(1.07)}}
#boot b{letter-spacing:.34em;font-size:12px;color:var(--ink2)}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Wizard ---------- */
.wz-dots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.wz-dots i{width:26px;height:5px;border-radius:4px;background:var(--line2);transition:background .2s}
.wz-dots i.on{background:var(--accent)}
.sumline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.sumline span{color:var(--ink2)}.sumline b{font-weight:600;text-align:right}

/* ---------- Wizard / print ---------- */
#printRoot{display:none}
@media print{
  body{overflow:visible;background:#fff}
  #app,#auth,#toasts,#modalRoot,#boot{display:none!important}
  #printRoot{display:block!important;visibility:visible!important;position:fixed;inset:0;background:#fff;color:#000}
  #printRoot *{visibility:visible!important}
  #printRoot .rcpt-paper{display:block!important;visibility:visible!important;box-shadow:none;max-width:80mm;margin:0;padding:4mm 2mm;border-radius:0;background:#fff!important;color:#171a1c!important}
  #printRoot .rcpt{font-size:11px}
  #printRoot .labels{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  #printRoot .label-card{border:1px dashed #999;border-radius:3mm;padding:3mm;text-align:center;page-break-inside:avoid;
    font-family:var(--fm);color:#000;background:#fff}
  #printRoot .label-card img{max-width:48mm}
  #printRoot .label-card .lb-name{font-family:var(--fd);font-weight:700;font-size:12pt}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1180px){
  #sidebar{width:66px}
  #sidebar .side-brand b,#sidebar .side-brand small,#sidebar .nav-item span,#sidebar .userchip div{display:none}
  .nav-item{justify-content:center;padding:11px 0}
  .side-brand{justify-content:center;padding:16px 0 12px}
  .side-foot{flex-direction:column;gap:6px}
  .userchip{justify-content:center}
}
@media(max-width:1024px){
  .pos-wrap{grid-template-columns:1fr;height:auto;overflow-y:auto}
  #page.flat{overflow-y:auto}
  .prod-grid{overflow:visible}
  .pos-right{max-height:none}
  .cart-lines{max-height:300px}
}
@media(max-width:860px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);width:238px;box-shadow:var(--shadow)}
  #sidebar .side-brand b,#sidebar .side-brand small,#sidebar .nav-item span,#sidebar .userchip div{display:block}
  .nav-item{justify-content:flex-start;padding:9px 12px}
  #sidebar.open{transform:none}
  .burger{display:inline-flex}
  #sideBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;backdrop-filter:blur(2px)}
  .auth-card{grid-template-columns:1fr;max-width:460px}
  .auth-brand{display:none}
  .clock{display:none}
  .pay-tabs{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:560px){
  #page{padding:14px}
  .pos-wrap{padding:12px}
  .toolbar .inp,.toolbar select.inp{min-width:0;flex:1}
  .tot-total b{font-size:22px}
}
</style>
</head>
<body>

<!-- ============ BOOT SPLASH ============ -->
<div id="boot">
  <div class="mark" id="bootMark"></div>
  <b>WEBCORE POS</b>
</div>

<!-- ============ AUTH VIEW ============ -->
<div id="auth" class="auth-wrap hidden">
  <div class="auth-card" id="authCard"></div>
  <div class="auth-foot">POWERED BY WEBCORE POS SYSTEM</div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="side-brand">
      <div class="mark" id="sideMark"></div>
      <div><b>M&amp;M ELECTRONIC</b><small>WEBCORE POS</small></div>
    </div>
    <nav class="side-nav" id="navList" aria-label="Main navigation"></nav>
    <div class="side-foot">
      <div class="userchip" id="sideUser"></div>
      <button class="icon-btn" data-action="pw-self" title="Change my password" aria-label="Change my password"></button>
      <button class="icon-btn" data-action="logout" title="Sign out" aria-label="Sign out"></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" data-action="toggle-sidebar" aria-label="Menu"></button>
      <h2 id="pageTitle">POS / Cashier</h2>
      <div class="top-spacer"></div>
      <span class="clock" data-clock></span>
      <button class="btn soft sm" data-action="scan-open" id="topScanBtn"></button>
      <button class="icon-btn" data-action="theme-toggle" id="themeBtn" aria-label="Toggle theme"></button>
    </header>
    <main id="page"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<div id="printRoot"></div>

<script>
/* ############################################################
   #  WEBCORE POS SYSTEM — single-file local POS              #
   #  Sections: utils · icons · storage · images(IDB) · sound #

   #  inventory · scanner · transactions · reports ·          #

const FileStore = {
  root: null, busy: false, queued: false,
  supported: () => typeof window.showDirectoryPicker === 'function',
  async chooseRoot() {
    if (!this.supported()) throw new Error('File storage is not supported by this browser.');
    this.root = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });
    await this.ensureLayout();
    await this.writeDatabase();
    toast('POS folder connected and ready.', 'success');
  },
  async ensureLayout() {
    if (!this.root) return;
    await this.root.getDirectoryHandle('Backup', { create: true });
    await this.root.getDirectoryHandle('data_0', { create: true });
    const reports = await this.root.getDirectoryHandle('data_report_0', { create: true });
    for (const name of ['daily_sales', 'monthly_sales', 'inventory', 'cashier', 'transactions', 'voided_transactions', 'refunds', 'audit_logs'])
      await reports.getDirectoryHandle(name, { create: true });
    await this.root.getDirectoryHandle('products', { create: true });
    await this.root.getDirectoryHandle('images', { create: true });
  },
  async writeJson(dir, name, value) {
    const file = await dir.getFileHandle(name, { create: true });
    const writable = await file.createWritable();
    await writable.write(JSON.stringify(value, null, 2));
    await writable.close();
  },
  async writeDatabase() {
    if (!this.root) return;
    const data = await this.root.getDirectoryHandle('data_0', { create: true });
    await this.writeJson(data, 'accounts.json', DB.data.accounts);
    await this.writeJson(data, 'account_metadata.json', DB.data.accountMetadata || {});
    await this.writeJson(data, 'cashier_auth.json', DB.data.cashierAuth || { configured: false });
    await this.writeJson(this.root, 'pos_data.json', DB.data);
    const products = await this.root.getDirectoryHandle('products', { create: true });
    await this.writeJson(products, 'products.json', DB.data.products);
  },
  async writeImage(name, dataUrl) {
    if (!this.root) return;
    const images = await this.root.getDirectoryHandle('images', { create: true });
    const file = await images.getFileHandle(name.replace(/[^\w.-]/g, '_') + '.jpg', { create: true });
    const writable = await file.createWritable();
    await writable.write(await (await fetch(dataUrl)).blob());
    await writable.close();
  },
  async writeBackup() {
    if (!this.root) return false;
    const backups = await this.root.getDirectoryHandle('Backup', { create: true });
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const dir = await backups.getDirectoryHandle(`backup_${stamp}`, { create: true });
    await this.writeJson(dir, 'backup.json', { app: 'WEBCORE POS SYSTEM', exportedAt: new Date().toISOString(), data: DB.data });
    return true;
  },
  queueSave() {
    if (!this.root || this.queued) return;
    this.queued = true;
    Promise.resolve().then(async () => {
      this.queued = false;
      if (this.busy) return;
      this.busy = true;
      try { await this.ensureLayout(); await this.writeDatabase(); }
      catch (e) { toast('Unable to save the POS files. Local backup remains available.', 'error', 5000); }
      finally { this.busy = false; }
    });
  },
  async writeReport(kind, record) {
    if (!this.root) return;
    try {
      const reports = await this.root.getDirectoryHandle('data_report_0', { create: true });
      const dir = await reports.getDirectoryHandle(kind, { create: true });
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      await this.writeJson(dir, `${kind}_report_${stamp}_${uid()}.json`, record);
    } catch (e) { toast('Report recorded locally, but the file report could not be written.', 'warn'); }
  }
};

const CryptoAuth = {
  iterations: 210000,
  async hash(password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: this.iterations, hash: 'SHA-256' }, key, 256);
    return `pbkdf2_sha256$${this.iterations}$${this.hex(salt)}$${this.hex(new Uint8Array(bits))}`;
  },
  async verify(password, encoded) {
    try {
      const [, iterations, saltHex, hashHex] = String(encoded).split('$');
      const salt = this.bytes(saltHex), expected = this.bytes(hashHex);
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: +iterations, hash: 'SHA-256' }, key, expected.length * 8));
      return bits.length === expected.length && bits.every((v, i) => v === expected[i]);
    } catch { return false; }
  },
  hex(bytes) { return [...bytes].map(v => v.toString(16).padStart(2, '0')).join(''); },
  bytes(hex) { return new Uint8Array((hex || '').match(/.{1,2}/g)?.map(v => parseInt(v, 16)) || []); }
};

/* ================= 4. IMAGE STORE (IndexedDB) ================= */
const ImgDB = {
  db: null, cache: new Map(),
  open() {
    return new Promise(res => {
      if (!window.indexedDB) return res();
      const rq = indexedDB.open('webcore_pos_images', 1);
      rq.onupgradeneeded = e => e.target.result.createObjectStore('imgs');
      rq.onsuccess = e => { this.db = e.target.result; res(); };
      rq.onerror = () => res();
    });
  },
  tx(mode) { return this.db.transaction('imgs', mode).objectStore('imgs'); },
  get(id) {
    if (this.cache.has(id)) return Promise.resolve(this.cache.get(id));
    return new Promise(res => {
      if (!this.db) return res(null);
      const rq = this.tx('readonly').get(id);
      rq.onsuccess = () => { this.cache.set(id, rq.result || null); res(rq.result || null); };
      rq.onerror = () => res(null);
    });
  },
  set(id, dataUrl) {
    this.cache.set(id, dataUrl);
    return new Promise(res => { if (!this.db) return res(); const rq = this.tx('readwrite').put(dataUrl, id); rq.onsuccess = rq.onerror = () => res(); });
  },
  del(id) {
    this.cache.delete(id);
    return new Promise(res => { if (!this.db) return res(); const rq = this.tx('readwrite').delete(id); rq.onsuccess = rq.onerror = () => res(); });
  }
};
async function hydrateImgs(root) {
  for (const img of root.querySelectorAll('img[data-imgid]')) {
    const url = await ImgDB.get(img.dataset.imgid);
    if (url) img.src = url;
  }
}
function fileToDataUrl(file, max = 380) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = () => rej(new Error('Not a valid image'));
      im.src = rd.result;
    };
    rd.onerror = () => rej(new Error('Could not read file'));
    rd.readAsDataURL(file);
  });
}
function validImageFile(file) {
  return !!file && ['image/jpeg', 'image/png', 'image/webp'].includes(String(file.type).toLowerCase());
}

/* ================= 5. SOUND (Web Audio, no files) ================= */
const Sound = {
  ctx: null,
  ensure() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* no audio */ }
    return this.ctx;
  },
  tone(freq, dur, type = 'sine', delay = 0, gain = 1) {
    const c = this.ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    const v = Math.min(1, num(settings().soundVolume)) * 0.22 * gain;
    g.gain.setValueAtTime(0.0001, c.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(Math.max(v, 0.001), c.currentTime + delay + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + dur);
    o.connect(g); g.connect(c.destination);

  },
  beep()   { if (!settings().soundScan) return; this.tone(1250, 0.08, 'sine', 0);    this.tone(1870, 0.1, 'sine', 0.09); },
  tick()   { if (!settings().soundScan) return; this.tone(1500, 0.045, 'sine', 0, .6); },
  error()  { if (!settings().soundError) return; this.tone(210, 0.24, 'square', 0, .8); },

}
const Modal = {
  stack: [],
  open(html, { size = 'md', onClose = null } = {}) {
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop';
    bd.innerHTML = `<div class="modal m-${size}" role="dialog" aria-modal="true">${html}</div>`;
    $('#modalRoot').appendChild(bd);
    const item = { bd, hook: onClose, api: null };
    const close = () => {
      const i = this.stack.indexOf(item); if (i < 0) return;
      this.stack.splice(i, 1);
      try { item.hook && item.hook(); } catch (e) {}
      bd.classList.remove('show');
      setTimeout(() => bd.remove(), 170);
    };
    item.api = { el: bd, close, set onClose(fn) { item.hook = fn; } };
    bd.addEventListener('mousedown', e => { if (e.target === bd) close(); });
    this.stack.push(item);
    requestAnimationFrame(() => bd.classList.add('show'));
    return item.api;
  },
  closeTop() { const it = this.stack[this.stack.length - 1]; if (it) it.api.close(); },
  closeAll() { [...this.stack].forEach(it => it.api.close()); }
};

/* ================= 7. TAX / VAT ENGINE =================
   Configurable rate + VAT-inclusive / VAT-exclusive modes.
   Supports VATable, VAT-exempt and zero-rated lines.
   NOTE: configurable tooling only — not legal/tax advice.  */
function computeTotals(items, orderDisc = null) {
  const s = settings();
  const rate = Math.max(0, num(s.vatRate));
  const incl = !!s.priceIncludesTax;
  const lines = items.map(it => ({ ...it, gross: r2(num(it.qty) * num(it.price) - num(it.disc)) }));
  const subtotal = r2(sum(lines.map(l => l.gross)));
  let disc = 0;
  if (orderDisc && num(orderDisc.value) > 0) {
    disc = orderDisc.type === 'percent' ? subtotal * num(orderDisc.value) / 100 : Math.min(num(orderDisc.value), subtotal);
    disc = Math.max(0, r2(disc));
  }
  const g = { vat: 0, exempt: 0, zero: 0 };
  lines.forEach(l => {
    const share = subtotal > 0 ? l.gross / subtotal * disc : 0;
    const net = r2(l.gross - share);
    g[l.taxStatus === 'exempt' ? 'exempt' : l.taxStatus === 'zero' ? 'zero' : 'vat'] += net;
  });
  const vatable = r2(g.vat);
  let vat, total;
  if (incl) { vat = r2(vatable * rate / (100 + rate)); total = r2(vatable + g.exempt + g.zero); }
  else      { vat = r2(vatable * rate / 100);          total = r2(vatable + g.exempt + g.zero + vat); }
  return { rate, incl, subtotal, discount: disc, vatable, exempt: r2(g.exempt), zero: r2(g.zero), vat, total, lines };
}
function nextReceiptNo(commit = false) {
  const d = ymd(new Date()), c = DB.data.counters;
  const seq = (commit ? ((c.day === d ? c.seq : 0) + 1) : ((c.day === d ? c.seq : 0) + 1));
  if (commit) { c.day = d; c.seq = seq; }
  return `${settings().receiptPrefix}-${d}-${String(seq).padStart(4, '0')}`;
}

function receiptLines(t) {
  const W = 42, L = [], s = t.snap || { storeName: settings().storeName, address: '', phone: '', footer: '' };
  const center = x => { x = String(x); return ' '.repeat(Math.max(0, Math.floor((W - x.length) / 2))) + x; };
  const hr = () => L.push('-'.repeat(W));
  const lr = (a, b) => { a = String(a); b = String(b); const sp = W - a.length - b.length;
    L.push(sp >= 0 ? a + ' '.repeat(sp) + b : (a.slice(0, Math.max(0, W - b.length - 1)) + ' ' + b)); };
  const wrap = x => { x = String(x); for (let i = 0; i < x.length; i += W - 2) L.push('  ' + x.slice(i, i + W - 2)); };
  L.push(center(s.storeName));
  if (s.address) String(s.address).split('\n').forEach(a => a.trim() && L.push(center(a.trim())));
  if (s.phone) L.push(center('Tel: ' + s.phone));
  hr();
  L.push(lr('Receipt No: ', t.receiptNo));
  L.push('Date: ' + t.dateStr + '    Time: ' + t.timeStr);
  L.push('Cashier: ' + t.cashier);
  if (t.customer && t.customer.name) L.push('Customer: ' + t.customer.name);
  hr();
  t.items.forEach(it => {
    wrap(it.name);
    L.push(lr(`  ${it.qty} x ${fmt(it.price)}` + (it.disc ? ` (-${fmt(it.disc)})` : ''), fmt(it.qty * it.price - it.disc)));
    if (it.taxStatus === 'exempt') L.push('  (VAT-Exempt)');
    if (it.taxStatus === 'zero') L.push('  (Zero-Rated)');
  });
  hr();
  const T = t.totals;
  if (T.discount > 0) { L.push(lr('Subtotal', fmt(T.subtotal))); L.push(lr('Less Discount', '(' + fmt(T.discount) + ')')); }
  L.push(lr('VATable Sales', fmt(T.vatable)));
  if (T.exempt > 0) L.push(lr('VAT-Exempt Sales', fmt(T.exempt)));
  if (T.zero > 0) L.push(lr('Zero-Rated Sales', fmt(T.zero)));
  L.push(lr(`VAT ${T.rate}%` + (T.incl ? ' (incl)' : ''), fmt(T.vat)));
  hr();
  L.push(lr('TOTAL', t.sym + fmt(T.total)));
  hr();
  L.push('Payment: ' + t.payment.method);
  if (t.payment.method === 'CASH') {
    L.push(lr('Received', fmt(t.payment.tendered)));
    L.push(lr('Change', fmt(t.payment.change)));
  } else if (t.payment.ref) L.push('Ref: ' + t.payment.ref);
  if (t.actionInfo) L.push(center('** ' + t.actionInfo.kind.toUpperCase() + 'ED — ' + t.actionInfo.reason + ' **'));
  hr();
  L.push(center('Thank you for shopping!'));
  L.push(center(s.storeName));
  return L;
}

/* ================= 12. BARCODE / QR GENERATION =================
   Code 128-B encoder + renderer — pure JS, fully offline.   */
const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function encode128(text) {
  const codes = [104]; let sum = 104;
  for (let i = 0; i < text.length; i++) {
    const v = text.charCodeAt(i) - 32;
    if (v < 0 || v > 94) throw new Error('Code128 supports ASCII 32–126 only');
    codes.push(v); sum += v * (i + 1);
  }
  codes.push(sum % 103, 106);
  return codes;
}
function drawBarcode(canvas, text, { module = 2, height = 90, showText = true } = {}) {
  const seq = [];
  encode128(text).forEach(c => {
    const p = C128[c];
    for (let i = 0; i < p.length; i++) for (let k = 0; k < +p[i]; k++) seq.push(i % 2 === 0 ? 1 : 0);
  });
  const quiet = module * 10, w = seq.length * module + quiet * 2, h = height + (showText ? 22 : 0);
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#000';
  let x = quiet;
  seq.forEach(b => { if (b) ctx.fillRect(x, 4, module, height); x += module; });
  if (showText) {
    ctx.font = '600 15px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.fillText(text, w / 2, h - 5);
  }
  return canvas;
}
function ean13Check(d12) {
  let s = 0;
  for (let i = 0; i < 12; i++) s += +d12[i] * (i % 2 === 0 ? 1 : 3);
  return String((10 - s % 10) % 10);
}
function genBarcode() { // EAN-13 compatible value with PH GS1 prefix 480
  let code;
  do {
    let d = '480';
    for (let i = 0; i < 9; i++) d += Math.floor(Math.random() * 10);
    code = d + ean13Check(d);
  } while (DB.data.products.some(p => p.barcode === code));
  return code;
}
function nextSku() {
  let mx = 0;
  DB.data.products.forEach(p => { const m = /MM-(\d+)/.exec(p.sku || ''); if (m) mx = Math.max(mx, +m[1]); });
  return 'MM-' + String(mx + 1).padStart(6, '0');
}
function drawQR(canvas, text, size = 190) {
  if (typeof qrcode === 'undefined') {
    canvas.width = canvas.height = 190;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 190, 190);
    ctx.fillStyle = '#999'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('QR library unavailable offline', 95, 90);
    ctx.fillText('(needs one-time internet)', 95, 106);
    return;
  }
  const qr = qrcode(0, 'M'); qr.addData(String(text)); qr.make();
  const n = qr.getModuleCount(), quiet = 3;
  const cell = Math.max(2, Math.floor(size / (n + quiet * 2))), dim = cell * (n + quiet * 2);
  canvas.width = canvas.height = dim;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, dim, dim);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
}
function openCodeModal(p) {
  let bc = p.barcode || p.sku;
  const m = Modal.open(`${mHead('Barcode & QR', p.name + ' · ' + p.sku)}

function renderProductTable() {
  const el = $('#prTable'); if (!el) return;
  const q = PR.q.toLowerCase();
  let list = [...DB.data.products].sort((a, b) => a.name.localeCompare(b.name));
  if (PR.cat !== 'All') list = list.filter(p => p.category === PR.cat);
  if (PR.status !== 'All') list = list.filter(p => p.status === PR.status);
  if (q) list = list.filter(p => [p.name, p.sku, p.barcode, p.brand, p.category].some(v => String(v || '').toLowerCase().includes(q)));
  if (!list.length) {
    el.innerHTML = `<div class="empty panel"><div class="empty-ic">${icon('box')}</div><b>NO PRODUCTS FOUND</b>
      <p>${DB.data.products.length ? 'Adjust your search or filters.' : 'Add your first product or load demo data to begin.'}</p>
      <button class="btn primary" data-action="prod-add">${icon('plus')} Add Product</button>
      ${!DB.data.products.length ? `<button class="btn ghost" data-action="demo-load">${icon('play')} Load demo products</button>` : ''}</div>`;
    return;
  }
  el.innerHTML = `<div class="panel" style="padding:0"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Product</th><th>SKU / Barcode</th><th>Category</th><th class="num">Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
    <tbody>${list.map(p => `
      <tr>
        <td><div class="pcell">${p.imgId ? `<img class="thumb" data-imgid="${p.imgId}">` :
          `<div class="thumb-tile" style="background:hsl(${hueOf(p.name)},45%,${document.documentElement.dataset.theme === 'dark' ? '22%' : '82%'})">${esc(p.name[0] || '?')}</div>`}
          <div><b>${esc(p.name)}</b><small>${esc(p.brand || '')}${p.demo ? ' · DEMO' : ''}</small></div></div></td>
        <td class="mono" style="font-size:12px">${esc(p.sku)}<br><span class="faint">${esc(p.barcode || '—')}</span></td>
        <td>${esc(p.category || '—')}</td>
        <td class="num"><b>${peso(p.price)}</b><br><span class="faint" style="font-size:11px">cost ${peso(p.cost)}</span></td>
        <td>${stockBadge(p)}<div class="mono faint" style="font-size:11px;margin-top:3px">${num(p.stock)} ${esc(p.unit || 'pc')}</div></td>
        <td><span class="badge ${p.status === 'active' ? 'b-done' : 'b-role'}">${p.status === 'active' ? 'ACTIVE' : 'INACTIVE'}</span></td>
        <td><div class="row-actions">
          <button class="icon-btn" data-action="prod-code" data-id="${p.id}" title="Barcode / QR">${icon('barcode')}</button>
          <button class="icon-btn" data-action="prod-edit" data-id="${p.id}" title="Edit">${icon('edit')}</button>
          <button class="icon-btn danger" data-action="prod-del" data-id="${p.id}" title="Delete">${icon('trash')}</button>
        </div></td>
      </tr>`).join('')}</tbody></table></div></div>`;
  hydrateImgs(el);
}

    ${cur || old ? `<button type="button" class="icon-btn danger" data-action="prod-img-remove" title="Remove image">${icon('trash')}</button>` : ''}`;
  hydrateImgs(box);
  box.querySelector('#pfImg2').addEventListener('change', async e => {

    if (!validImageFile(f)) return toast('Use a JPG, JPEG, PNG, or WEBP image.', 'error');

function saveProduct(m) {
  const g = id => m.el.querySelector('#' + id);
  const name = g('pfName').value.trim();
  const sku = g('pfSku').value.trim();
  const barcode = g('pfBarcode').value.trim();
  const price = num(g('pfPrice').value);
  const cost = num(g('pfCost').value);
  const stock = Math.floor(num(g('pfStock').value));
  const p = ProdForm.editing;
  // Validation per spec
  if (!name) return failPf('Product name cannot be empty.');
  if (!sku) return failPf('SKU cannot be empty.');
  if (price < 0) return failPf('Selling price cannot be negative.');
  if (cost < 0) return failPf('Purchase price cannot be negative.');
  if (stock < 0) return failPf('Stock cannot be negative.');
  const dupSku = DB.data.products.find(x => x.sku.toLowerCase() === sku.toLowerCase() && (!p || x.id !== p.id));
  if (dupSku) return failPf(`SKU “${sku}” already belongs to “${dupSku.name}”.`);
  if (barcode) {
    const dupBc = DB.data.products.find(x => x.barcode && x.barcode.toLowerCase() === barcode.toLowerCase() && (!p || x.id !== p.id));
    if (dupBc) return failPf(`Barcode “${barcode}” already belongs to “${dupBc.name}”.`);
  }
  const oldStock = p ? num(p.stock) : null;
  const rec = p || { id: uid(), createdAt: new Date().toISOString(), demo: false };
  Object.assign(rec, {
    name, sku, barcode, price: r2(price), cost: r2(cost), stock,
    minStock: Math.max(0, Math.floor(num(g('pfMin').value))),
    category: g('pfCat').value.trim(), brand: g('pfBrand').value.trim(),
    supplier: g('pfSupplier').value.trim(), desc: g('pfDesc').value.trim(),
    unit: g('pfUnit').value, taxStatus: g('pfTax').value, status: g('pfStatus').value
  });
  // Image handling (IndexedDB)
  const finalize = () => {
    if (!p) DB.data.products.push(rec);
    else if (oldStock !== null && oldStock !== stock)
      invLog({ productId: rec.id, name: rec.name, type: 'adjust', qty: stock - oldStock, before: oldStock, after: stock, by: user().username, note: 'Edited in product form', receiptNo: '' });
    DB.save();
    Modal.closeAll();
    toast(p ? 'Product updated.' : 'Product added.', 'success');
    if (!p && rec.barcode) setTimeout(() => openCodeModal(rec), 120);
    if (currentPage === 'products') renderProductTable();
    if (currentPage === 'pos') { renderPosGrid(); renderPosCats(); }
    if (currentPage === 'inventory') go('inventory');
  };
  if (ProdForm.img) {
    const oldId = p && p.imgId;
    rec.imgId = ProdForm.img.id;
    rec.image = `images/${rec.sku}.jpg`;
    ImgDB.set(rec.imgId, ProdForm.img.dataUrl).then(async () => {
      try { await FileStore.writeImage(rec.sku, ProdForm.img.dataUrl); } catch (e) { if (FileStore.root) toast('Product saved, but the image file could not be written.', 'warn'); }
      if (oldId && oldId !== rec.imgId) ImgDB.del(oldId);
      finalize();
    });
  } else if (p && p._imgRemoved) {
    const oldId = p.imgId;
    rec.imgId = null; rec.image = null; delete rec._imgRemoved;
    if (oldId) ImgDB.del(oldId);
    finalize();
  } else if (!p || (!rec.imgId && !ProdForm.editing?.imgId)) { rec.imgId = null; finalize(); }
  else if (p && !p.imgId) { rec.imgId = null; finalize(); }
  else finalize();
}
function failPf(msg) { Sound.error(); toast(msg, 'error'); }

async function removeDemoProducts(silent = false) {
  const demoP = DB.data.products.filter(p => p.demo);
  const demoC = DB.data.customers.filter(c => c.demo);
  if (!demoP.length && !demoC.length) { if (!silent) toast('No demo data to remove.', 'info'); return; }
  if (!silent) {
    const ok = await confirmBox({ title: 'Remove demo data?', msg: `This permanently removes <b>${demoP.length}</b> demo product(s) and <b>${demoC.length}</b> demo customer(s). Sales history is kept.`, ok: 'Remove' });
    if (!ok) return;
  }
  for (const p of demoP) p.imgId && ImgDB.del(p.imgId);
  DB.data.products = DB.data.products.filter(p => !p.demo);
  DB.data.customers = DB.data.customers.filter(c => !c.demo);
  DB.save();
  toast('Demo data removed.', 'success');
  if (currentPage === 'products') renderProductTable();
  if (currentPage === 'pos') { renderPosGrid(); renderPosCats(); }
  if (currentPage === 'customers') go('customers');
}

function renderInvTable() {
  const el = $('#invTable'); if (!el) return;
  const q = INV.q.toLowerCase();
  let list = [...DB.data.products];
  if (INV.cat !== 'All') list = list.filter(p => p.category === INV.cat);
  if (q) list = list.filter(p => [p.name, p.sku, p.barcode, p.brand].some(v => String(v || '').toLowerCase().includes(q)));
  if (INV.sort === 'stock-asc') list.sort((a, b) => num(a.stock) - num(b.stock));
  else if (INV.sort === 'stock-desc') list.sort((a, b) => num(b.stock) - num(a.stock));
  else if (INV.sort === 'value') list.sort((a, b) => num(b.cost) * num(b.stock) - num(a.cost) * num(a.stock));
  else list.sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length) { el.innerHTML = `<div class="empty panel"><div class="empty-ic">${icon('layers')}</div><b>NO PRODUCTS FOUND</b><p>No inventory matches your filters.</p></div>`; return; }
  el.innerHTML = `<div class="panel" style="padding:0"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Product</th><th>Category</th><th class="num">Stock</th><th class="num">Min</th><th>Status</th><th class="num">Value</th><th></th></tr></thead>

      <td class="num" style="color:${l.qty >= 0 ? 'var(--accent)' : 'var(--danger)'}"><b>${l.qty >= 0 ? '+' : ''}${l.qty}</b></td>
      <td class="num mono faint" style="font-size:12px">${l.before} → ${l.after}</td>

async function openStockMove(p, type) {
  const labels = { in: 'Stock In', out: 'Stock Out', set: 'Set Stock' };
  const v = await formModal({
    title: labels[type] + ' — ' + p.name, sub: `Current stock: ${num(p.stock)} ${p.unit || 'pc'}`,
    fields: [
      { name: 'qty', label: type === 'set' ? 'New stock quantity' : 'Quantity', type: 'number', required: true, min: type === 'set' ? 0 : 1, step: 1, ph: '0' },
      { name: 'note', label: 'Reason / note', type: 'textarea', ph: type === 'in' ? 'e.g. Supplier delivery' : 'e.g. Damaged unit' }
    ], ok: 'Apply'
  });
  if (!v) return;
  const q = Math.floor(num(v.qty));
  if (type !== 'set' && q <= 0) { Sound.error(); return toast('Quantity must be greater than zero.', 'error'); }
  const before = num(p.stock);
  let after = before;
  if (type === 'in') after = r2(before + q);
  else if (type === 'out') { if (q > before) { Sound.error(); return toast('Cannot remove more than current stock.', 'error'); } after = r2(before - q); }
  else after = q;
  p.stock = after;
  invLog({ productId: p.id, name: p.name, type: type === 'in' ? 'stock-in' : type === 'stock-out' ? 'stock-out' : 'adjust', qty: r2(after - before), before, after, by: user().username, note: v.note || '', receiptNo: '' });
  DB.save();
  toast(`Stock updated: ${p.name} → ${after}.`, 'success');
  go('inventory');
}
