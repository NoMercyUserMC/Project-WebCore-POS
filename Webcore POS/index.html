const ScanLog = [];
const Scanner = {
  active: false, engine: null, mode: 'single', camId: '', stream: null, h5: null,
  timer: null, lastCode: '', lastAt: 0, els: null, inModal: false, closeAfter: false,
  mount(container, { inModal = false } = {}) {
    this.stop(); this.inModal = inModal; this.mode = settings().scannerMode || 'single';
    container.innerHTML = `
      <div class="scan-shell">
        <div class="scan-stage" id="scStage">
          <video class="scan-video" id="scVideo" playsinline muted autoplay></video>
          <div id="qcTarget" style="display:none"></div>
          <div class="scan-corner sc-tl"></div><div class="scan-corner sc-tr"></div>
          <div class="scan-corner sc-bl"></div><div class="scan-corner sc-br"></div>
          <div class="scan-laser"></div>
          <div class="scan-flash" id="scFlash"><div class="sf-ic"></div><b></b><span></span></div>
        </div>
        <div class="scan-status" id="scStatus"><span class="dotp"></span><span id="scStatusTxt">Camera stopped.</span></div>
        <div class="scan-controls">
          <button class="btn primary" data-action="scan-start">${icon('camera')} START CAMERA</button>
          <button class="btn ghost" data-action="scan-stop">${icon('pause')} Stop</button>
          <div class="seg" role="group" aria-label="Scan mode">
            <button data-action="scan-mode" data-m="single" class="${this.mode === 'single' ? 'on' : ''}">Single scan</button>
            <button data-action="scan-mode" data-m="continuous" class="${this.mode === 'continuous' ? 'on' : ''}">Continuous</button>
          </div>
          <select id="scCam" class="inp" style="width:auto;min-width:160px"><option value="">Default camera</option></select>
          <span class="faint" style="font-size:11px">EAN-13 · EAN-8 · UPC-A/E · Code 128 · Code 39 · QR</span>
        </div>
        <form id="scManual" style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="scManualInp" class="inp mono" style="flex:1;min-width:180px" placeholder="Manual barcode fallback — type code and press Enter" autocomplete="off">
          <button class="btn soft" type="submit">${icon('plus')} Add</button>
        </form>
        <div class="scanlist" id="scList"></div>
      </div>`;
    this.els = {
      stage: container.querySelector('#scStage'), video: container.querySelector('#scVideo'),
      qc: container.querySelector('#qcTarget'), flash: container.querySelector('#scFlash'),
      status: container.querySelector('#scStatus'), statusTxt: container.querySelector('#scStatusTxt'),
      cam: container.querySelector('#scCam'), list: container.querySelector('#scList')
    };
    this.camId = '';
    this.els.cam.addEventListener('change', () => { this.camId = this.els.cam.value; if (this.active) this.start(); });
    container.querySelector('#scManual').addEventListener('submit', e => {
      e.preventDefault();
      const v = container.querySelector('#scManualInp').value.trim();
      if (!v) return;
      container.querySelector('#scManualInp').value = '';
      this.handleCode(v, true);
    });
    this.renderList();
    this.fillCams();
  },
  async fillCams() {
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const physical = devs.find(d => !/snap|virtual|obs/i.test(d.label || ''));
      if (!this.camId && physical) this.camId = physical.deviceId;
      const cur = this.camId;
      this.els.cam.innerHTML = '<option value="">Default camera</option>' +
        devs.map((d, i) => `<option value="${esc(d.deviceId)}">${esc(d.label || 'Camera ' + (i + 1))}</option>`).join('');
      if (cur) this.els.cam.value = cur;
    } catch (e) { /* enumerate unavailable */ }
  },
  setStatus(txt, live = false) {
    if (!this.els) return;
    this.els.statusTxt.textContent = txt;
    this.els.status.classList.toggle('live', live);
    this.els.stage.classList.toggle('live', live);
  },
  async start() {
    this.stop(true);
    this.setStatus('Requesting camera permission…');
    try {
      if (window.BarcodeDetector && navigator.mediaDevices) await this.startNative();
      else if (window.Html5Qrcode) await this.startH5();
      else {
        this.setStatus('Camera engine unavailable. Use manual barcode input below.');
        toast('Camera scanning unavailable — manual input ready below.', 'warn', 5000);
      }
    } catch (err) {
      const msg = err && err.name === 'NotAllowedError' ? 'Camera access was denied. Use manual barcode input instead.'
        : err && err.name === 'NotFoundError' ? 'No camera was found on this device. Use manual input.'
        : 'Could not start camera: ' + (err && err.message ? err.message : 'unknown error');
      this.setStatus(msg); Sound.error(); toast(msg, 'error', 5200);
    }
  },
  async startNative() {
    await this.fillCams();
    const video = {};
    if (this.camId) video.deviceId = { exact: this.camId }; else video.facingMode = 'environment';
    video.width = { ideal: 1280 }; video.height = { ideal: 720 };
    this.stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    this.els.qc.style.display = 'none'; this.els.video.style.display = 'block';
    this.els.video.srcObject = this.stream;
    await this.els.video.play();
    let formats = null;
    try { formats = await window.BarcodeDetector.getSupportedFormats(); } catch (e) {}
    const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code', 'itf']
      .filter(f => !formats || (formats.includes ? formats.includes(f) : true));
    this.detector = new window.BarcodeDetector({ formats: want });
    this.engine = 'native';
    this.active = true;
    this.setStatus('Scanning… (' + this.mode + ' mode)', true);
    this.timer = setInterval(async () => {
      if (!this.active || !this.detector) return;
      try {
        const found = await this.detector.detect(this.els.video);
        if (found && found.length) this.handleCode(found[0].rawValue);
      } catch (e) { /* frame skip */ }
    }, 180);
  },
  async startH5() {
    await this.fillCams();
    this.els.video.style.display = 'none'; this.els.qc.style.display = 'block';
    let cams = [];
    try { cams = await Html5Qrcode.getCameras(); } catch (e) {}
    if (cams.length) {
      const physical = cams.find(c => !/snap|virtual|obs/i.test(c.label || ''));
      if (!this.camId && physical) this.camId = physical.id;
      this.els.cam.innerHTML = '<option value="">Default camera</option>' +
        cams.map((c, i) => `<option value="${esc(c.id)}">${esc(c.label || 'Camera ' + (i + 1))}</option>`).join('');
    }
    let h5 = null;
    try {
      const F = window.Html5QrcodeSupportedFormats, fm = [];
      if (F) ['EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'CODE_128', 'CODE_39', 'QR_CODE'].forEach(k => { if (F[k] !== undefined) fm.push(F[k]); });
      h5 = fm.length ? new Html5Qrcode('qcTarget', { formatsToSupport: fm, verbose: false }) : new Html5Qrcode('qcTarget', { verbose: false });
    } catch (e) { h5 = new Html5Qrcode('qcTarget'); }
    this.h5 = h5; this.engine = 'h5';
    await h5.start(this.camId || { facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.min(320, w * 0.85), height: Math.min(170, h * 0.5) }) },
      txt => this.handleCode(txt), () => {});
    this.active = true;
    this.setStatus('Scanning… (' + this.mode + ' mode)', true);
  },
  stop(silent = false) {
    this.active = false;
    clearInterval(this.timer); this.timer = null; this.detector = null;
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if (this.els && this.els.video) { try { this.els.video.srcObject = null; } catch (e) {} }
    if (this.h5) { try { this.h5.stop().then(() => this.h5.clear()).catch(() => {}); } catch (e) {} this.h5 = null; }
    this.engine = null;
    if (!silent && this.els) this.setStatus('Camera stopped.');
  },
  handleCode(raw, force = false) {
    const code = String(raw || '').trim();
    if (!code) return;
    const now = Date.now();
    if (!force && code === this.lastCode && now - this.lastAt < 1200) return;
    this.lastCode = code; this.lastAt = now;
    const p = DB.data.products.find(x => x.status === 'active' &&
      ((x.barcode && x.barcode.toLowerCase() === code.toLowerCase()) || x.sku.toLowerCase() === code.toLowerCase()));
    if (!p) {
      Sound.error();
      this.flash('PRODUCT NOT FOUND', 'No product matches this barcode: ' + code, 'err');
      this.logScan(code, false, 'No product matches this barcode.');
      return;
    }
    const r = addToCart(p.id, 1);
    if (!r.ok) {
      Sound.error();
      this.flash(r.code === 'out' ? 'OUT OF STOCK' : 'STOCK LIMIT', r.msg, 'err');
      this.logScan(code, false, r.msg);
      return;
    }
    Sound.beep();
    this.flash('SCANNED SUCCESSFULLY', `${p.name} added to cart (${cartQtyOf(p.id)} in cart)`, 'ok');
    this.logScan(code, true, p.name);
    if (this.mode === 'single') {
      this.setStatus('Code captured. Stopping…');
      setTimeout(() => {
        this.stop(true);
        if (this.inModal && this.closeAfter) Modal.closeAll();
        else if (this.els) this.setStatus('Scan complete. Press START CAMERA to scan again.');
      }, 850);
    }
  },
  flash(title, sub, kind) {
    if (!this.els) return;
    const f = this.els.flash;
    f.className = 'scan-flash show ' + kind;
    f.querySelector('.sf-ic').innerHTML = icon(kind === 'ok' ? 'check' : 'alert', 26);
    f.querySelector('b').textContent = (kind === 'ok' ? '✓ ' : '! ') + title;
    f.querySelector('span').textContent = sub;
    clearTimeout(this._ft);
    this._ft = setTimeout(() => f.classList.remove('show'), 1600);
  },
  logScan(code, ok, info) {
    ScanLog.unshift({ at: new Date(), code, ok, info });
    if (ScanLog.length > 12) ScanLog.length = 12;
    this.renderList();
  },
  renderList() {
    if (!this.els) return;
    this.els.list.innerHTML = ScanLog.length ? ScanLog.map(s => `
      <div class="scan-item ${s.ok ? '' : 'miss'}">
        <div><b>${s.ok ? esc(s.info) : 'NOT FOUND'}</b><div class="mono">${esc(s.code)}</div></div>
        <span class="mono faint">${fmtTime(s.at)}</span>
      </div>`).join('')
      : `<div class="faint" style="font-size:12px;text-align:center;padding:8px">Recent scans will appear here.</div>`;
  }
};

const TX = { range: 'today', q: '', cashier: 'All', status: 'All', custom: '' };
function rangeDates(r) {
  const n = new Date(), s = dayStart();
  if (r === 'today') return [s, new Date(s.getTime() + 864e5)];
  if (r === 'yesterday') return [new Date(s.getTime() - 864e5), s];
  if (r === 'week') { const mon = new Date(s); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7)); return [mon, new Date(s.getTime() + 864e5)]; }
  if (r === 'month') return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 1)];
  return [null, null];
}
function filteredTxns() {
  let list = [...DB.data.transactions];
  if (TX.range === 'custom' && TX.custom) {
    const [y, m, d] = TX.custom.split('-').map(Number);
    list = list.filter(t => { const dt = new Date(t.date); return dt.getFullYear() === y && dt.getMonth() + 1 === m && dt.getDate() === d; });
  } else if (TX.range !== 'all') {
    const [a, b] = rangeDates(TX.range);
    if (a) list = list.filter(t => { const d = new Date(t.date); return d >= a && d < b; });
  }
  if (TX.cashier !== 'All') list = list.filter(t => t.cashier === TX.cashier);
  if (TX.status !== 'All') list = list.filter(t => t.status === TX.status);
  if (TX.q) { const q = TX.q.toLowerCase();
    list = list.filter(t => [t.receiptNo, t.cashier, t.customer?.name, t.payment.method].some(v => String(v || '').toLowerCase().includes(q))); }
  return list;
}

async function txnAction(id, kind) {
  const t = DB.data.transactions.find(x => x.id === id);
  if (!t) return;
  if (t.status !== 'completed') { Sound.error(); return toast('This transaction is already ' + t.status + '.', 'warn'); }
  const fields = [{ name: 'reason', label: 'Reason *', type: 'textarea', required: true, ph: kind === 'void' ? 'e.g. Wrong items entered' : 'e.g. Customer returned the item' }];
  if (user().role !== 'admin')
    fields.push({ name: 'cp', label: 'Cashier password / PIN *', type: 'password', required: true });
  const v = await formModal({
    title: kind === 'void' ? 'Void Transaction' : 'Process Refund',
    sub: `${t.receiptNo} · ${t.sym}${fmt(t.totals.total)} — stock will be restored and the action recorded.`,
    fields, ok: kind === 'void' ? 'Void Sale' : 'Confirm Refund', danger: true
  });
  if (!v) return;
  let actor = user().username;
  if (user().role !== 'admin') {
    if (!DB.data.cashierAuth?.passwordHash || !(await CryptoAuth.verify(v.cp, DB.data.cashierAuth.passwordHash))) {
      Sound.error(); return toast('Cashier authorization failed.', 'error');
    }
  }
  t.status = kind === 'void' ? 'voided' : 'refunded';
  t.actionInfo = { kind, reason: v.reason, by: actor, at: new Date().toISOString() };
  t.items.forEach(it => {
    const p = prod(it.productId);
    if (p) { const before = num(p.stock); p.stock = r2(before + it.qty);
      invLog({ productId: p.id, name: p.name, type: 'void-restore', qty: it.qty, before, after: p.stock, by: actor, note: kind + ': ' + v.reason, receiptNo: t.receiptNo }); }
  });
  DB.save();
  FileStore.writeReport(kind === 'void' ? 'voided_transactions' : 'refunds', t);
  toast(`${kind === 'void' ? 'Transaction voided' : 'Refund recorded'} — stock restored.`, 'success');
  Modal.closeAll();
  if (currentPage === 'transactions') renderTxTable();
  if (currentPage === 'reports') go('reports');
  if (currentPage === 'pos') { renderPosGrid(); renderCart(); }
}

  if (REP.range === 'today') {
    for (let h = 0; h < 24; h++) series.push({ label: h === 0 ? '12AM' : h < 12 ? h + 'AM' : h === 12 ? '12PM' : (h - 12) + 'PM', v: 0 });
    txns.forEach(t => { series[new Date(t.date).getHours()].v += t.totals.total; });
  } else {
    const days = REP.range === 'week' ? 7 : 30;
    const start = new Date(dayStart().getTime() - (days - 1) * 864e5);
    for (let i = 0; i < days; i++) { const d = new Date(start.getTime() + i * 864e5); series.push({ label: pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()), v: 0 }); }
    txns.forEach(t => { const idx = Math.floor((dayStart(new Date(t.date)) - start) / 864e5); if (series[idx]) series[idx].v += t.totals.total; });
  }
  // best sellers
  const byP = {};
  txns.forEach(t => t.items.forEach(i => {
    byP[i.productId] = byP[i.productId] || { name: i.name, qty: 0, rev: 0 };
    byP[i.productId].qty += i.qty; byP[i.productId].rev += i.qty * i.price - i.disc;
  }));
  const best = Object.values(byP).sort((a, b) => b.qty - a.qty).slice(0, 6);
  // payments
  const pay = {};
  txns.forEach(t => pay[t.payment.method] = r2((pay[t.payment.method] || 0) + t.totals.total));
  const payRows = Object.entries(pay).sort((a, b) => b[1] - a[1]);
  // cashiers
  const byC = {};
  txns.forEach(t => { byC[t.cashier] = byC[t.cashier] || { n: 0, items: 0, total: 0 };
    byC[t.cashier].n++; byC[t.cashier].items += t.items.reduce((a, i) => a + i.qty, 0); byC[t.cashier].total += t.totals.total; });
  // vat
  const vat = { vatable: r2(sum(txns.map(t => t.totals.vatable))), exempt: r2(sum(txns.map(t => t.totals.exempt))),
    zero: r2(sum(txns.map(t => t.totals.zero))), vat: r2(sum(txns.map(t => t.totals.vat))) };
  const maxS = Math.max(...series.map(s => s.v), 1);
  const bw = REP.range === 'today' ? 30 : 20, gap = REP.range === 'today' ? 12 : 6;
  const W = series.length * (bw + gap) + gap, H = 190;
  const bars = series.map((s, i) => {
    const bh = Math.round(s.v / maxS * 130), x = gap + i * (bw + gap), y = 150 - bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh, 1.5)}" rx="4" fill="${s.v > 0 ? 'var(--accent)' : 'var(--line2)'}"><title>${s.label}: ${settings().currencySymbol}${fmt(s.v)}</title></rect>
      ${(REP.range !== 'today' ? series.length <= 10 || i % 5 === 0 : i % 3 === 0) ? `<text x="${x + bw / 2}" y="168" text-anchor="middle" font-size="8.5" fill="var(--ink3)" font-family="var(--fm)">${s.label}</text>` : ''}`;
  }).join('');
  const payColors = { CASH: 'var(--accent)', CARD: 'var(--steel)', GCASH: 'var(--teal)', MAYA: 'var(--warn)', OTHER: 'var(--ink3)' };
  const maxPay = Math.max(...payRows.map(p => p[1]), 1);
  el.innerHTML = `
    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi hot"><small>TODAY'S SALES</small><b>${settings().currencySymbol}${fmt(REP.range === 'today' ? sales : sum(DB.data.transactions.filter(t => t.status === 'completed' && new Date(t.date) >= rangeDates('today')[0]).map(t => t.totals.total)))}</b></div>
      <div class="kpi"><small>TRANSACTIONS</small><b>${txns.length}</b><div class="kpi-sub">${all.length - txns.length} voided/refunded in range</div></div>
      <div class="kpi"><small>ITEMS SOLD</small><b>${itemsSold}</b></div>
      <div class="kpi warnk"><small>LOW STOCK</small><b>${low}</b></div>
      <div class="kpi dangerk"><small>OUT OF STOCK</small><b>${out}</b></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h3>${icon('chart')} Sales — ${REP.range === 'today' ? 'today by hour' : 'per day'}</h3>
        <span class="mono faint" style="font-size:12px">peak ${settings().currencySymbol}${fmt(maxS)}</span></div>
        <div class="chart-wrap"><svg width="${W}" height="${H}" style="display:block">
          ${[0.25, 0.5, 0.75, 1].map(f => `<line x1="${gap}" x2="${W - gap}" y1="${150 - 130 * f}" y2="${150 - 130 * f}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}
          ${bars}<line x1="${gap}" x2="${W - gap}" y1="150" y2="150" stroke="var(--line2)"/>
        </svg></div></div>
      <div class="panel"><div class="panel-head"><h3>${icon('box')} Best Sellers</h3></div>
        ${best.length ? best.map((b, i) => `
          <div class="bar-row"><span class="bl">${esc(b.name)}</span>
            <div class="bar-track"><div class="bar-fill ${i > 0 ? 'alt' : ''}" style="width:${Math.round(b.qty / best[0].qty * 100)}%"></div></div>
            <span class="bv">${b.qty} · ${settings().currencySymbol}${fmt(b.rev)}</span></div>`).join('')
        : `<div class="empty" style="padding:30px"><b>NO SALES IN RANGE</b><p>Best sellers appear once you complete sales.</p></div>`}
      </div>
      <div class="panel"><div class="panel-head"><h3>${icon('wallet')} Payment Methods</h3></div>
        ${payRows.length ? payRows.map(([m, v]) => `
          <div class="bar-row"><span class="bl">${esc(m)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v / maxPay * 100)}%;background:${payColors[m] || 'var(--accent)'}"></div></div>
            <span class="bv">${settings().currencySymbol}${fmt(v)}</span></div>`).join('')
        : `<p class="faint" style="padding:14px 0">No payments in this range.</p>`}</div>
      <div class="panel"><div class="panel-head"><h3>${icon('pct')} VAT / Tax Summary</h3></div>
        <div class="sumline"><span>VATable sales</span><b class="mono">${settings().currencySymbol}${fmt(vat.vatable)}</b></div>
        <div class="sumline"><span>VAT collected (${settings().vatRate}%${settings().priceIncludesTax ? ', inclusive' : ', additive'})</span><b class="mono" style="color:var(--accent)">${settings().currencySymbol}${fmt(vat.vat)}</b></div>
        <div class="sumline"><span>VAT-exempt sales</span><b class="mono">${settings().currencySymbol}${fmt(vat.exempt)}</b></div>
        <div class="sumline" style="border:none"><span>Zero-rated sales</span><b class="mono">${settings().currencySymbol}${fmt(vat.zero)}</b></div>
        <div class="hint" style="margin-top:10px">Configurable rate in Settings · informational only, not tax advice.</div></div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-head"><h3>${icon('user')} Cashier Sales</h3></div>
      ${Object.keys(byC).length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:480px">
        <thead><tr><th>Cashier</th><th class="num">Transactions</th><th class="num">Items</th><th class="num">Total</th></tr></thead>
        <tbody>${Object.entries(byC).sort((a, b) => b[1].total - a[1].total).map(([c, v]) => `
          <tr><td><b>${esc(c)}</b></td><td class="num">${v.n}</td><td class="num">${v.items}</td><td class="num"><b>${settings().currencySymbol}${fmt(r2(v.total))}</b></td></tr>`).join('')}</tbody>
      </table></div>` : `<p class="faint">No cashier activity in this range.</p>`}</div>`;
}

async function createUser() {
  const v = await formModal({
    title: 'Create Account', sub: 'Credentials are stored as secure password hashes.',
    fields: [
      { name: 'u', label: 'Username *', required: true, ph: 'e.g. cashier1' },
      { name: 'p', label: 'Password *', type: 'password', required: true, hint: 'Minimum 4 characters.' },
      { name: 'role', label: 'Role', type: 'select', options: [{ v: 'cashier', t: 'Cashier — POS, scanning, receipts' }, { v: 'admin', t: 'Admin — full access' }] }
    ], ok: 'Create Account'
  });
  if (!v) return;
  if (v.u.length < 3) { Sound.error(); return toast('Username must be at least 3 characters.', 'error'); }
  if (v.p.length < 4) { Sound.error(); return toast('Password must be at least 4 characters.', 'error'); }
  if (DB.data.accounts.some(a => a.username.toLowerCase() === v.u.toLowerCase())) { Sound.error(); return toast('Username already exists.', 'error'); }
  DB.data.accounts.push({ id: uid(), username: v.u, passwordHash: await CryptoAuth.hash(v.p), role: v.role, active: true, createdAt: new Date().toISOString() });
  DB.save(); toast(`Account “${v.u}” created.`, 'success'); go('users');
}
async function changePassword(target) {
  const self = target.username === user().username;
  const fields = [];
  if (self) fields.push({ name: 'cur', label: 'Current password *', type: 'password', required: true });
  fields.push({ name: 'p', label: 'New password *', type: 'password', required: true },
              { name: 'p2', label: 'Confirm new password *', type: 'password', required: true });
  const v = await formModal({ title: 'Change Password — ' + target.username, fields, ok: 'Update Password' });
  if (!v) return;
  if (self && !(await CryptoAuth.verify(v.cur, target.passwordHash))) { Sound.error(); return toast('Current password is incorrect.', 'error'); }
  if (v.p.length < 4) { Sound.error(); return toast('Password must be at least 4 characters.', 'error'); }
  if (v.p !== v.p2) { Sound.error(); return toast('New passwords do not match.', 'error'); }
  target.passwordHash = await CryptoAuth.hash(v.p); delete target.password; DB.save();
  toast('Password updated.', 'success');
  if (currentPage === 'users') go('users');
}

async function saveSettings() {
  const g = id => $(id);
  const s = settings();
  const name = g('#stName').value.trim();
  if (!name) { Sound.error(); return toast('Store name cannot be empty.', 'error'); }
  const vat = num(g('#stVat').value);
  if (vat < 0 || vat > 50) { Sound.error(); return toast('VAT rate must be between 0 and 50.', 'error'); }
  s.storeName = name; s.storeAddress = g('#stAddr').value.trim(); s.storePhone = g('#stPhone').value.trim();
  s.currency = g('#stCur').value.trim() || 'PHP'; s.currencySymbol = g('#stSym').value.trim() || '₱';
  s.vatRate = vat; s.priceIncludesTax = $$('input[name="stMode"]').find(r => r.checked).value === 'incl';
  s.receiptPrefix = g('#stPrefix').value.trim() || 'MM'; s.receiptFooter = g('#stFooter').value.trim();
  s.theme = g('#stTheme').value; s.lowStockThreshold = Math.max(0, Math.floor(num(g('#stLow').value)));
  s.scannerMode = g('#stScanMode').value;
  s.soundScan = g('#stSndScan').checked; s.soundError = g('#stSndErr').checked; s.soundVolume = num(g('#stVol').value);
  const cashierSecret = g('#stCashier').value;
  if (cashierSecret) {
    if (cashierSecret.length < 4) { Sound.error(); return toast('Cashier password must be at least 4 characters.', 'error'); }
    DB.data.cashierAuth = { passwordHash: await CryptoAuth.hash(cashierSecret), updatedAt: new Date().toISOString() };
  }
  DB.save(); applyTheme();

async function exportBackup() {
  const images = {};
  for (const p of DB.data.products) if (p.imgId) { const d = await ImgDB.get(p.imgId); if (d) images[p.imgId] = d; }
  const payload = {
    app: 'WEBCORE POS SYSTEM', store: settings().storeName, version: 1, exportedAt: new Date().toISOString(),
    notice: 'Local/offline POS backup. Passwords are stored as secure hashes; keep this file private.',
    data: DB.data, images
  };
  download(`webcore-pos-backup-${ymd(new Date())}.json`, JSON.stringify(payload, null, 2), 'application/json');
  if (FileStore.root) {
    try { await FileStore.writeBackup(); } catch (e) { toast('Download succeeded, but the POS folder backup failed.', 'warn'); }
  }
  settings().lastBackup = new Date().toISOString(); DB.save();
  toast(FileStore.root ? 'Backup exported to the POS folder.' : 'Backup exported. Connect the POS folder to store it there.', 'success'); go('backup');
}
async function importBackup(file) {
  let payload;
  try { payload = JSON.parse(await file.text()); } catch { Sound.error(); return toast('That file is not valid JSON.', 'error'); }
  if (!payload || !payload.data || !Array.isArray(payload.data.products)) { Sound.error(); return toast('This does not look like a WEBCORE POS backup.', 'error'); }
  const d = payload.data;
  const ok = await confirmBox({
    title: 'Restore this backup?',
    msg: `Exported ${payload.exportedAt ? new Date(payload.exportedAt).toLocaleString() : 'unknown date'} from “${esc(payload.store || 'unknown store')}”.<br><br>
      Replaces current data: <b>${d.products.length}</b> products · <b>${(d.transactions || []).length}</b> transactions · <b>${(d.accounts || []).length}</b> accounts.`,
    ok: 'Restore', phrase: 'RESTORE'
  });
  if (!ok) return;
  if (payload.images) for (const [id, url] of Object.entries(payload.images)) await ImgDB.set(id, url);
  DB.data = Object.assign(DB.defaults(), d);
  DB.data.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  DB.save(); applyTheme(); buildNav(); go('pos');
  toast('Backup restored successfully.', 'success');
}
function toXML(o, tag, ind = '') {
  if (Array.isArray(o)) return o.map(v => toXML(v, tag, ind)).join('\n');
  if (o === null || o === undefined) return `${ind}<${tag}/>`;
  if (typeof o !== 'object') return `${ind}<${tag}>${esc(o)}</${tag}>`;
  const inner = Object.entries(o).map(([k, v]) => toXML(v, k.replace(/[^\w.-]/g, '_'), ind + '  ')).join('\n');
  return `${ind}<${tag}>\n${inner}\n${ind}</${tag}>`;
}
function exportXML() {
  const d = DB.data;
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<!-- WEBCORE POS local export. Passwords are stored as secure hashes. -->\n<webcore-pos exported="${new Date().toISOString()}" store="${esc(settings().storeName)}">\n${toXML(d.settings, 'settings', '  ')}\n${toXML(d.products, 'products', '  ')}\n${toXML(d.transactions, 'transactions', '  ')}\n${toXML(d.customers, 'customers', '  ')}\n${toXML(d.accounts, 'accounts', '  ')}\n</webcore-pos>`;
  download(`webcore-pos-export-${ymd(new Date())}.xml`, xml, 'application/xml');
  toast('XML export downloaded (data only, no images).', 'success');
}

    window._codeCtx = { productId: p.id, code: p.barcode };
    el.closest('.modal').querySelector('.code-val').textContent = p.barcode;
    drawBarcode(el.closest('.modal').querySelector('#cBC'), p.barcode);
    drawQR(el.closest('.modal').querySelector('#cQR'), `${p.name}|${p.sku}|${p.barcode}|${peso(p.price)}`);
    el.closest('.modal').querySelector('[data-action="code-copy"]').dataset.code = p.barcode;
    toast('New barcode linked to product.', 'success');
  },
  'code-copy': d => copyText(d.code),
  'code-dl-bc': () => {
    const cv = $('#cBC'); if (!cv) return;
    const a = document.createElement('a'); a.download = 'barcode-' + window._codeCtx.code + '.png'; a.href = cv.toDataURL('image/png'); a.click();
    toast('Barcode image downloaded.', 'success');
  },
  'code-dl-qr': () => {
    const cv = $('#cQR'); if (!cv) return;
    const a = document.createElement('a'); a.download = 'qr-' + window._codeCtx.code + '.png'; a.href = cv.toDataURL('image/png'); a.click();
    toast('QR image downloaded.', 'success');
  },
  'code-print': () => {
    const p = prod(window._codeCtx.productId); if (!p) return;
    const bcCv = document.createElement('canvas'); drawBarcode(bcCv, p.barcode);
    const qrCv = document.createElement('canvas'); drawQR(qrCv, `${p.name}|${p.sku}|${p.barcode}|${peso(p.price)}`);
    $('#printRoot').innerHTML = `<div class="labels">
      <div class="label-card"><div class="lb-name">${esc(p.name)}</div><div>${peso(p.price)}</div>
        <img src="${bcCv.toDataURL()}" alt=""><div>${esc(p.barcode)}</div>
        <img src="${qrCv.toDataURL()}" style="max-width:26mm" alt=""></div></div>`;
    document.body.classList.add('print-mode');
    const cleanup = () => { document.body.classList.remove('print-mode'); $('#printRoot').innerHTML = ''; };
    window.addEventListener('afterprint', cleanup, { once: true });
    window.print(); setTimeout(cleanup, 2500);
  },
  /* inventory */
  'inv-move': d => { const p = prod(d.id); p && openStockMove(p, d.type); },
  /* scanner */
  'scan-start': () => Scanner.start(),
  'scan-stop': () => Scanner.stop(),
  'scan-mode': (d, el) => {
    Scanner.mode = d.m; settings().scannerMode = d.m; DB.save();
    el.closest('.seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === d.m));
    if (Scanner.active) Scanner.setStatus('Scanning… (' + d.m + ' mode)', true);
  },
  /* transactions */
  'txn-range': (d, el) => {
    TX.range = d.r; TX.custom = '';
    const dt = $('#txDate'); if (dt) dt.value = '';
    $$('.chip[data-action="txn-range"]').forEach(c => c.classList.toggle('on', c.dataset.r === d.r));
    renderTxTable();
  },
  'txn-view': d => { const t = DB.data.transactions.find(x => x.id === d.id); t && showReceipt(t, false); },
  'txn-print': d => { const t = DB.data.transactions.find(x => x.id === d.id); t && printReceipt(t); },
  'txn-void': d => txnAction(d.id, 'void'),
  'txn-refund': d => txnAction(d.id, 'refund'),
  'txn-export': () => {
    const rows = [['Receipt', 'Date', 'Time', 'Cashier', 'Customer', 'Items', 'Subtotal', 'Discount', 'VAT', 'Total', 'Payment', 'Status']];
    filteredTxns().forEach(t => rows.push([t.receiptNo, t.dateStr, t.timeStr, t.cashier, t.customer?.name || 'Walk-in',
      t.items.reduce((a, i) => a + i.qty, 0), fmt(t.totals.subtotal), fmt(t.totals.discount), fmt(t.totals.vat), fmt(t.totals.total), t.payment.method, t.status]));
    download(`sales-history-${ymd(new Date())}.csv`, toCSV(rows), 'text/csv');
    toast('Sales history exported.', 'success');
  },
  /* reports */
  'rep-range': (d, el) => { REP.range = d.r; $$('.chip[data-action="rep-range"]').forEach(c => c.classList.toggle('on', c.dataset.r === d.r)); renderReports(); },
  'rep-export': () => {
    const rows = [['Receipt', 'Date', 'Time', 'Cashier', 'Total', 'VAT', 'Payment', 'Status']];
    repTxns().filter(t => t.status === 'completed').forEach(t => rows.push([t.receiptNo, t.dateStr, t.timeStr, t.cashier, fmt(t.totals.total), fmt(t.totals.vat), t.payment.method, t.status]));
    const csv = toCSV(rows);
    download(`report-${REP.range}-${ymd(new Date())}.csv`, csv, 'text/csv');
    FileStore.writeReport('audit_logs', { range: REP.range, generatedAt: new Date().toISOString(), csv });
    toast('Report exported.', 'success');
  },
  /* customers */
  'cust-add': () => customerForm(null),
  'cust-edit': d => { const c = DB.data.customers.find(x => x.id === d.id); c && customerForm(c); },
  'cust-del': async d => {
    const c = DB.data.customers.find(x => x.id === d.id); if (!c) return;
    if (await confirmBox({ title: 'Delete customer?', msg: `<b>${esc(c.name)}</b> will be removed. Their past receipts remain in history.`, ok: 'Delete' })) {
      DB.data.customers = DB.data.customers.filter(x => x.id !== c.id);
      DB.save(); renderCustomers(); toast('Customer deleted.', 'success');
    }
  },
  'cust-hist': d => {
    const c = DB.data.customers.find(x => x.id === d.id); if (!c) return;
    const tx = DB.data.transactions.filter(t => t.customer && t.customer.id === c.id);
    Modal.open(`${mHead('Purchase History — ' + c.name, c.cid + (c.phone ? ' · ' + c.phone : ''))}
      ${tx.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:420px">
        <thead><tr><th>Receipt</th><th>Date</th><th class="num">Total</th><th>Status</th><th></th></tr></thead>
        <tbody>${tx.map(t => `<tr><td class="mono" style="font-size:12px">${esc(t.receiptNo)}</td><td>${t.dateStr} ${t.timeStr}</td>
          <td class="num"><b>${t.sym}${fmt(t.totals.total)}</b></td><td><span class="badge ${t.status === 'completed' ? 'b-done' : 'b-void'}">${t.status}</span></td>
          <td><button class="icon-btn" data-action="txn-view" data-id="${t.id}" title="View">${icon('file')}</button></td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty" style="padding:30px"><b>NO PURCHASES YET</b><p>This customer has no recorded transactions.</p></div>`}`,
      { size: 'md' });
  },
  /* users */
  'user-add': () => createUser(),
  'user-pw': d => { const a = DB.data.accounts.find(x => x.id === d.id); a && changePassword(a); },
  'user-toggle': d => {
    const a = DB.data.accounts.find(x => x.id === d.id); if (!a) return;
    if (a.username === user().username) { Sound.error(); return toast('You cannot disable your own account.', 'error'); }
    const admins = DB.data.accounts.filter(x => x.role === 'admin' && x.active && x.id !== a.id);
    if (a.role === 'admin' && a.active && !admins.length) { Sound.error(); return toast('Cannot disable the last active admin.', 'error'); }
    a.active = !a.active; DB.save(); go('users');
    toast(`Account “${a.username}” ${a.active ? 'enabled' : 'disabled'}.`, 'success');
  },
  'user-del': async d => {
    const a = DB.data.accounts.find(x => x.id === d.id); if (!a) return;
    if (a.username === user().username) { Sound.error(); return toast('You cannot delete your own account.', 'error'); }
    if (a.role === 'admin' && DB.data.accounts.filter(x => x.role === 'admin' && x.active && x.id !== a.id).length === 0)
      { Sound.error(); return toast('Cannot delete the last active admin.', 'error'); }
    if (await confirmBox({ title: 'Delete account?', msg: `<b>${esc(a.username)}</b> (${a.role}) will be permanently removed.`, ok: 'Delete' })) {
      DB.data.accounts = DB.data.accounts.filter(x => x.id !== a.id);
      DB.save(); go('users'); toast('Account deleted.', 'success');
    }
  },
  /* settings & backup */
  'settings-save': () => saveSettings(),
  'sound-test': () => { Sound.beep(); setTimeout(() => Sound.error(), 350); },
  'bk-connect': async () => {
    try { await FileStore.chooseRoot(); if (currentPage === 'backup') go('backup'); }
    catch (e) { if (e.name !== 'AbortError') toast(e.message || 'Unable to connect the POS folder.', 'error'); }
  },
  'bk-json': () => exportBackup(),
  'bk-xml': () => exportXML(),
  'bk-demo-clear': () => removeDemoProducts(),
  'bk-txn-clear': async () => {
    if (await confirmBox({ title: 'Clear transaction history?', msg: 'All sales, voids and refunds will be permanently deleted. Products, accounts and settings are kept. Receipt numbering restarts.', ok: 'Clear History', phrase: 'CLEAR' })) {
      DB.data.transactions = []; DB.data.held = []; DB.data.counters = { day: '', seq: 0 };
      DB.save(); toast('Transaction history cleared.', 'success');
    }
  },
  'bk-factory': async () => {
    if (await confirmBox({ title: 'Factory reset?', msg: '<b>Everything</b> — products, sales, accounts, settings and images — will be erased and the app will restart.', ok: 'Erase Everything', phrase: 'RESET' })) {
      localStorage.removeItem(DB.key); localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY);
      try { indexedDB.deleteDatabase('webcore_pos_images'); } catch (e) {}
      location.reload();
    }
  },
  /* wizard */
  'wz-next': () => wzNext(),
  'wz-back': () => { if (WZ.step > 1) { WZ.step--; renderWz(); } },
  'wz-skip': () => { settings().setupDone = true; DB.save(); window._wzModal && window._wzModal.close(); toast('You can finish setup anytime in Settings.', 'info'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});

/* ================= 26. KEYBOARD SHORTCUTS ================= */
document.addEventListener('keydown', e => {
  if (e.key === 'F2') { e.preventDefault(); if (currentPage !== 'pos') go('pos'); setTimeout(() => { const i = $('#posSearch'); i && i.focus(); }, 60); }
  else if (e.key === 'F4') { e.preventDefault(); openScanModal(); }
  else if (e.key === 'F8') { e.preventDefault(); if (currentPage === 'pos' && !Modal.stack.length) openCheckout(); }
  else if (e.key === 'Escape') {
    if (Scanner.active && Scanner.inModal) { Scanner.stop(); Modal.closeAll(); }
    else if (Modal.stack.length) Modal.closeTop();
    else { const sb = $('#sidebar'); if (sb && sb.classList.contains('open')) Actions['toggle-sidebar'](); }
  }
});

/* ================= 27. INIT ================= */
(async function init() {
  DB.load();
  await migrateCredentials();
  applyTheme();
  $('#bootMark').innerHTML = icon('bolt', 32);
  await ImgDB.open();
  clockTick();
  setInterval(clockTick, 1000);
  renderAuth();
  setTimeout(() => $('#boot').classList.add('off'), 420);
  setTimeout(() => $('#boot').remove(), 950);
})();
</script>
</body>
</html>
